[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goannotate"
version = "1.0.0"
description = "Functional annotation of gene models (gene symbols, protein names, GO terms) from Diamond searches against UniProt"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.9"
authors = [
    {name = "Ehren J. Bentz"},
]
dependencies = []

[project.scripts]
goannotate = "goannotate.cli:main"

[tool.setuptools.packages.find]
include = ["goannotate*"]

[tool.setuptools.package-data]
goannotate = ["data/*.txt"]
